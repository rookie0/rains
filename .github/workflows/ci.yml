name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust 1.86 quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: quality-rust-1.86.0

      - name: Check formatting
        run: cargo +1.86.0 fmt --all -- --check

      - name: Check
        run: cargo +1.86.0 check --locked --all-targets

      - name: Clippy
        run: cargo +1.86.0 clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo +1.86.0 test --locked --all-targets

      - name: Test documentation
        run: cargo +1.86.0 test --locked --doc

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: rains-x86_64-apple-darwin.tar.gz
            musl: false
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            archive: rains-x86_64-pc-windows-msvc.zip
            musl: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: rains-x86_64-unknown-linux-gnu.tar.gz
            musl: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive: rains-x86_64-unknown-linux-musl.tar.gz
            musl: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          key: release-rust-1.86.0-${{ matrix.target }}

      - name: Build release binary
        run: cargo +1.86.0 build --release --locked --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -C "target/${{ matrix.target }}/release" -czf "${{ matrix.archive }}" rains

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/rains.exe" -DestinationPath "${{ matrix.archive }}"

      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ matrix.archive }}
          archive: false
          if-no-files-found: error
